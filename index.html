function renderCarnetList(){
  var q=norm(S.q), all=figs().filter(function(f){
    if(S.filt==="couple"&&f.type==="rueda")return false;

var R=null;

function drawNext(){

  c.forEach(function(id){tot+=weight(id)}); var r=Math.random()*tot;
  for(var i=0;i<c.length;i++){r-=weight(c[i]);if(r<=0)return c[i]}
  return c[c.length-1];
}

    var v=speechSynthesis.getVoices().filter(function(x){return /^es/i.test(x.lang)});if(v.length)u.voice=v[0];speechSynthesis.speak(u)}catch(e){}

  R={mode:o.mode,pool:o.pool,auto:o.auto,nom:o.nom,seq:[],cur:-1,ok:0,ko:0,marks:{},total:o.mode==="revue"?Math.min(15,Math.max(o.pool.length,8)):0,
     ctx:null,timer:null,raf:null,next8:0,nextT:0,q:[],startT:0,figStart:[],wake:null};
  R.seq.push(drawNext());
  renderStage();
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){R&&(R.wake=w)}).catch(function(){})}catch(e){}
  try{var AC=window.AudioContext||window.webkitAudioContext;R.ctx=new AC();R.ctx.resume()}catch(e){R.ctx=null}
  if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}
  if(R.ctx){R.nextT=R.ctx.currentTime+0.15;R.startT=R.nextT;R.timer=setInterval(schedule,25);R.raf=requestAnimationFrame(tick)}
  else if(R.auto){R.auto=false;toast("Son indisponible sur cet appareil : révision à votre rythme.")}
  if(!R.auto){R.cur=0;speak(R.seq[0]);paint()}
  else{R.figStart=[8];setStageText(null,"Écoutez la clave…",S.figs[R.seq[0]]?"Première figure au prochain 1":"")}
}
function click(t,hi){
  if(!S.set.son||!R.ctx)return;
  var c=R.ctx,o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=hi?2500:1200;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(hi?0.35:0.06,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+(hi?0.06:0.03));
  var f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=hi?2500:1500;f.Q.value=hi?8:3;
  o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.08);
}
function schedule(){
  if(!R||!R.ctx)return;
  var sp=60/S.set.bpm/2, pat=CLAVE[S.set.clave];
  while(R.nextT<R.ctx.currentTime+0.12){
    var e=R.next8, pos=e%16, hit=pat.indexOf(pos)>=0;
    click(R.nextT,hit); if(!hit&&e%2===0)click(R.nextT,false);
    R.q.push({t:R.nextT,e:e});
    R.next8++; R.nextT+=sp;
  }
}
function tick(){
  if(!R)return;
  var now=R.ctx.currentTime;
  while(R.q.length&&R.q[0].t<=now){var ev=R.q.shift();onEighth(ev.e)}
  R.raf=requestAnimationFrame(tick);
}
function onEighth(e){
  var pos=e%16, cl=document.querySelectorAll(".clave i");
  cl.forEach(function(x,i){x.classList.toggle("cur",i===pos)});
  if(e%2)return;
  var temps=e/2;
  if(R.auto){
    var i=R.figStart.length-1, start=R.figStart[i], len=figLen(R.seq[i]);
    if(temps===start-4) speak(R.seq[i]);
    if(temps===start){R.cur=i;paint()}
    if(R.cur===i&&temps===start+len-4){
      if(R.mode==="revue"&&R.seq.length>=R.total){setNext("Dernière figure")}
      else{R.seq.push(drawNext());R.figStart.push(start+len);setNext("Ensuite : "+S.figs[R.seq[i+1]].nom);speak(R.seq[i+1]);}
    }
    if(R.cur===i&&temps===start+len&&R.mode==="revue"&&R.seq.length>=R.total){endSession();return}
  }
  var cn=document.getElementById("count"); if(cn) cn.textContent=String((temps%8)+1);
}
function setStageText(name,lead,meta){var s=document.querySelector(".stage");if(!s)return;
  if(name!=null)s.querySelector(".name").textContent=name;if(lead!=null)s.querySelector(".lead").textContent=lead;if(meta!=null)s.querySelector(".meta").textContent=meta}
function setNext(t){var n=document.getElementById("nxt");if(n)n.textContent=t}
function paint(){
  var id=R.seq[R.cur], f=S.figs[id]; if(!f)return;
  var l=LV[f.niveau]||LV[0];
  setStageText(f.nom,"LE CANTANTE ANNONCE",[l.nom,f.temps?f.temps+" temps":"",f.depart?"départ en "+f.depart:""].filter(Boolean).join(" · "));
  if(!R.auto) setNext("");
  var p=document.getElementById("prog");
  if(p) p.textContent=R.mode==="revue"?"FIGURE "+(R.cur+1)+" SUR "+R.total:(R.nom||"ENCHAÎNEMENT").toUpperCase()+" · "+((R.cur%R.pool.length)+1)+" / "+R.pool.length;
  document.querySelectorAll("[data-mark]").forEach(function(b){b.disabled=false});
}
function renderStage(){
  var t=TEMPOS.filter(function(x){return x.bpm===S.set.bpm})[0]||{nom:""}, cl="";
  for(var i=0;i<16;i++) cl+='<i class="'+(CLAVE[S.set.clave].indexOf(i)>=0?"h":"")+'"></i>';
  document.getElementById("stageHost").innerHTML='<div class="stage" role="dialog" aria-modal="true" aria-label="Révision">'+
    '<div class="sh"><button class="ib" type="button" id="stStop" aria-label="Arrêter">'+I.x+'</button><span id="prog"></span><button class="ib" type="button" id="stVoice" aria-label="'+(S.set.voix?"Couper la voix":"Activer la voix")+'">'+(S.set.voix?I.voice:I.mute)+"</button></div>"+
    '<div class="ctr"><span class="lead">LE CANTANTE ANNONCE</span><h2 class="name" aria-live="polite"></h2><span class="meta"></span><span class="nxt" id="nxt"></span>'+
    '<div class="clave" aria-hidden="true">'+cl+'</div><span class="lead">CLAVE '+S.set.clave+" · "+t.nom.toUpperCase()+" "+S.set.bpm+'</span><span class="count" id="count" aria-hidden="true"></span></div>'+
    '<div class="foot"><div class="seg c2"><button type="button" data-mark="0" disabled>Ratée, à revoir</button><button type="button" data-mark="1" class="on m2" disabled>Je l’ai</button></div>'+
    (R.auto?'<p class="sub" style="margin:0;font-size:13px;text-align:center">Marquez la figure en cours ; la suivante arrive en musique.</p>':"")+"</div></div>";
  var st=document.getElementById("stageHost");
  st.querySelector("#stStop").onclick=stopSession;
  st.querySelector("#stVoice").onclick=function(){S.set.voix=!S.set.voix;save();this.innerHTML=S.set.voix?I.voice:I.mute;this.setAttribute("aria-label",S.set.voix?"Couper la voix":"Activer la voix");if(!S.set.voix&&"speechSynthesis" in window)speechSynthesis.cancel()};
  st.querySelectorAll("[data-mark]").forEach(function(b){b.onclick=function(){mark(b.dataset.mark==="1")}});
}
function mark(ok){
  if(!R||R.cur<0)return;
  var id=R.seq[R.cur], f=S.figs[id]; if(!f)return;
  var key=R.cur;
  if(R.marks[key]==null){ok?R.ok++:R.ko++}else if(R.marks[key]!==ok){if(ok){R.ok++;R.ko--}else{R.ko++;R.ok--}}
  R.marks[key]=ok;
  R.base=R.base||{}; if(R.base[id]==null) R.base[id]=f.maitrise||0;
  f.maitrise=ok?Math.min(2,R.base[id]+1):0;
  f.revue=Date.now(); save();
  document.querySelectorAll("[data-mark]").forEach(function(b){b.disabled=true});
  if(!R.auto){
    if(R.mode==="revue"&&R.seq.length>=R.total){endSession();return}
    R.seq.push(drawNext());R.cur++;speak(R.seq[R.cur]);paint();
  }
}
function cleanupAudio(){
  if(!R)return;
  clearInterval(R.timer);cancelAnimationFrame(R.raf);
  try{R.ctx&&R.ctx.close()}catch(e){}
  try{R.wake&&R.wake.release()}catch(e){}
  if("speechSynthesis" in window)try{speechSynthesis.cancel()}catch(e){}
}
function stopSession(){var had=R&&(R.ok+R.ko)>0;cleanupAudio();if(had){showSummary();return}R=null;document.getElementById("stageHost").innerHTML="";render()}
function endSession(){cleanupAudio();showSummary()}
function showSummary(){
  var r=R; R=null;
  var h='<div class="stage done" role="dialog" aria-modal="true" aria-label="Bilan"><div class="ctr"><span class="lead" style="color:var(--muted)">BILAN DE LA RÉVISION</span>'+
    '<h2 class="name">'+r.ok+" réussie"+(r.ok>1?"s":"")+"</h2><span class=\"meta\" style=\"color:var(--muted)\">"+(r.ko?plur(r.ko,"figure repart","figures repartent")+" dans « À revoir ».":"Aucune figure ratée.")+"</span></div>"+
    '<div class="foot"><button class="btn ocre wide" type="button" id="sumOk">Terminer</button></div></div>';
  document.getElementById("stageHost").innerHTML=h;
  document.getElementById("sumOk").onclick=function(){document.getElementById("stageHost").innerHTML="";render()};
  document.getElementById("sumOk").focus();
}
document.addEventListener("visibilitychange",function(){if(document.hidden&&R&&R.auto)stopSession()});

/* ---------- Message ---------- */
function toast(msg,withUndo){
  clearTimeout(toastT);
  var host=document.getElementById("toastHost");
  host.innerHTML='<div class="toast" role="status"><span></span>'+(withUndo&&undo?'<button type="button" id="undoBtn">Annuler</button>':"")+"</div>";
  host.querySelector("span").textContent=msg;
  var u=host.querySelector("#undoBtn"); if(u) u.onclick=function(){if(undo){S.figs[undo.id]=undo.f;undo=null;save();render()}host.innerHTML=""};
  toastT=setTimeout(function(){host.innerHTML=""},5000);
}

/* ---------- Démarrage ---------- */
load();
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0) window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
